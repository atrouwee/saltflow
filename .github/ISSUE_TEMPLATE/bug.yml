name: Bug report
description: Something in saltFlow does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please leave out anything private about your product.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The command you ran, and a small flow file if the bug depends on one (the bundled example is best).
      placeholder: |
        1. saltflow demo
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `saltflow doctor`
      description: Run `saltflow doctor` in the repo where it happens and paste the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Anything saltFlow printed, or the browser console if the page misbehaves.
      render: text
  - type: input
    id: device
    attributes:
      label: Browser and device (for page bugs)
      placeholder: Safari on an iPhone, Chrome on a laptop at 1280px
