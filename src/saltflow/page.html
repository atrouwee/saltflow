<style>
/* The page. saltglass and saltFlow's own layer are inlined above (src/saltflow/vendor): the tinted ground, the
   frosted sidebar, the floating card, the sheets, the chips and capsules. What follows is the review itself: the map
   on the tint, the crop on the card, the sheets' content. */
html, body { height: 100%; margin: 0; background: #000; }
.app :where(input, textarea, select) { font: inherit; color: inherit; }

/* the sidebar: Today */
.item .st { white-space: normal; text-align: left; }
.item .accent-ico.live { color: var(--gl-live); }
.rail .empty { padding: 18px 16px; font-size: 14px; }
.popover.top { top: 70px; bottom: auto; }
.popover .row .check { margin-left: auto; }
.rail-top .heading { margin: 0; padding: 0; min-width: 0; }
.ref { cursor: copy; }
.refs .row-sub { white-space: normal; }

/* the map, on the tint */
.results { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.results .dim { color: var(--dim); font-size: 13px; }
.map { flex: 1; min-height: 0; padding: 0 14px 18px; display: grid; place-items: start start; overflow: auto; }
.map svg { width: var(--w); height: var(--h); max-width: none; display: block; font-family: var(--font); }
.node { cursor: pointer; }
.node .frame { fill: var(--wash); }
.node.sel .frame { fill: var(--wash-2); stroke: var(--ink); stroke-width: 1.5; }
.node .r-ghost { fill: color-mix(in srgb, var(--ink) 7%, transparent); }
.node .r-arrive { fill: color-mix(in srgb, var(--ink) 22%, transparent); stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: 1; }
.node.unbuilt .r-arrive { fill: none; stroke-dasharray: 4 3; }
.node .r-line { fill: color-mix(in srgb, var(--ink) 42%, transparent); }
.node .r-act { fill: color-mix(in srgb, var(--ink) 85%, transparent); }
.node .name { fill: var(--ink); font-size: 13px; font-weight: 600; }
.node .place { fill: var(--dim); font-size: 11.5px; }
.node .badge { font-size: 11.5px; font-weight: 650; }
.node .here { stroke: var(--gl-live); stroke-width: 2; fill: none; }
.node .heretext { fill: var(--gl-live); font-size: 11.5px; font-weight: 600; }
.node .notecount { fill: var(--dim); font-size: 11px; }
.edge { fill: none; stroke: color-mix(in srgb, var(--ink) 50%, transparent); stroke-width: 1.5; }
.edge.back { stroke-dasharray: 5 4; stroke: color-mix(in srgb, var(--ink) 32%, transparent); }
.edge.system { stroke-dasharray: 2 4; }
.edge.cancel { stroke-dasharray: 5 4; }
.edge.loop { stroke-dasharray: 1 3; }
.edge.error { stroke: var(--fault); }
.edge.onpath { stroke-width: 2.5; stroke: var(--ink); }
.elabel { font-size: 11px; fill: var(--dim); paint-order: stroke; stroke: var(--gl-ground); stroke-width: 3px; stroke-linejoin: round; }
.elabel.error { fill: var(--fault); }
.lane { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--dim); }
.lanerule { stroke: var(--hair); }
.empty { align-self: center; max-width: 44ch; text-align: center; color: var(--dim); display: grid; gap: 10px; padding: 24px; }
.empty b { color: var(--ink); font-size: 17px; }
.empty code { font: 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); }

/* the card: the step */
.detail { overflow: hidden; }
.detail-head .tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.crop { margin: 4px 20px 8px; border-radius: 14px; overflow: hidden; background: var(--wash); display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 3; }
.crop img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.crop .none { color: var(--dim); font-size: 14px; text-align: center; padding: 18px 22px; max-width: 32ch; }
.crop-note { margin: -4px 20px 8px; font-size: 12.5px; color: var(--dim); }
.crop.unbuilt { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hair); outline: 1.5px dashed var(--faint); outline-offset: -8px; }
.crop svg { width: 100%; height: 100%; display: block; }
.tc-meta { padding: 0 20px 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--dim); }
.tc-meta b { color: var(--ink); font-weight: 600; }
.tc-meta code { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; }
.lines .group-h { padding-left: 0; padding-right: 0; }
.line.plain { cursor: default; }
.line.plain:active { opacity: 1; }
.line .line-mark.g { font-size: 14px; text-align: center; }
.unsent .line:last-child { box-shadow: none; }
.acts .round.frost { color: var(--ink); }
.detail-pills .tagbtn.mono { cursor: default; font-family: ui-monospace, Menlo, monospace; font-weight: 500; }

/* the sheets: Why, and the note */
@keyframes from-right { from { transform: translateX(calc(100% + 40px)); } }
@keyframes grow { from { transform: scale(.9); opacity: 0; } }
.layer.place-right .sheet { animation: from-right 460ms var(--gl-ease); }
.layer.place-zoom .sheet { animation: grow 420ms var(--gl-ease); }
.layer.place-zoom { place-items: center; }
.sheet-body .bars { display: grid; gap: 2px; }
.facts .quote { display: block; padding: 12px 0; font-size: 15px; line-height: 1.4; }
.facts .quote span { display: block; color: var(--dim); font-size: 13px; margin-top: 4px; }
.facts > div.stance { gap: 8px; justify-content: flex-start; }
.stance b { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; }
.rowbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; flex: 1; min-width: 0; }
.rowbar .track { display: block; height: 5px; border-radius: 3px; background: var(--wash-2); margin-top: 6px; overflow: hidden; }
.rowbar .fill { height: 100%; background: var(--dim); }
.row.chosen .rowbar .fill { background: var(--accent); }
.textrow textarea { width: 100%; min-height: 110px; border: 0; background: transparent; outline: none; resize: vertical; padding: 10px 0; }
.sheet-foot .primary { flex: none; margin-left: auto; }
.layer { animation: none; }

/* the left: the product's flows by area; the feed is a drawer beside it */
.flowrow .item-label { font-weight: 500; }
.flowrow .st { font-size: 12.5px; }
.rail-foot .heading { flex: 1; }
.rail-foot .who span { font-size: 13px; }
.feed { position: absolute; z-index: 7; top: 12px; bottom: 12px; left: 312px; width: 400px; display: flex; flex-direction: column;
  border-radius: 22px; overflow: hidden; transform: translateX(-24px); opacity: 0; pointer-events: none;
  transition: transform 320ms var(--gl-ease), opacity 220ms ease; }
.app .feed.frost::before { display: none; }   /* solid: the map must not read through the list */
.app .feed[data-gl-appearance=light] { background: #e8ebf0; }
.app .feed[data-gl-appearance=dark] { background: #1b2027; }
.feed.onboard { left: 18px; top: 66px; }
.feed.open { transform: none; opacity: 1; pointer-events: auto; }
.feed-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px 20px; }
.feed-head h2 { margin: 0; font: 650 19px var(--font); flex: 1; }
.feed-tabs { display: flex; gap: 6px; padding: 4px 14px 10px; flex-wrap: wrap; }
.feed-tabs .cat { font-size: 13.5px; padding: 6px 11px; }
.feed .rail-list { padding-top: 0; }
.mid-head { padding: 4px 22px 2px; }
.mid-head h1 { margin: 0; font: 700 24px var(--font); color: var(--ink); }
.mid-head p { margin: 4px 0 0; color: var(--dim); font-size: 14px; max-width: 80ch; }
.results { padding: 8px 22px 4px; }
.crop.live { cursor: zoom-in; position: relative; }
.crop.live::after { content: 'Open live'; position: absolute; right: 10px; bottom: 10px; font: 600 12.5px var(--font); padding: 5px 10px;
  border-radius: 999px; background: color-mix(in srgb, var(--gl-ground) 80%, transparent); color: var(--ink); opacity: 0; transition: opacity 160ms; }
.crop.live:hover::after { opacity: 1; }
.livebox { position: absolute; inset: 14px; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; }
.livebar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
.livebar h3 { margin: 0; font: 650 17px var(--font); }
.livebar .trail { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; color: var(--dim); font-size: 13px; flex: 1; }
.livebar .trail b { color: var(--ink); font-weight: 600; }
.livebar .trail .done { color: var(--ink); }
.livestage { flex: 1; min-height: 0; display: grid; place-items: center; background: #000; overflow: hidden; }
.livestage iframe { border: 0; background: #fff; }
.livestage .clip { position: relative; overflow: hidden; border-radius: 14px; box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
.livestage .clip iframe { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.livestate { padding: 8px 16px 12px; font-size: 13.5px; color: var(--dim); }
.livestate.fault { color: var(--fault); }
/* the journey board: stages as columns, flows as tiles: the board is home, a flow opens inside it */
#board { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; padding: 18px 18px 0; color: var(--ink); }
#board[hidden] { display: none; }
.bd-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.bd-top h1 { margin: 0; font: 700 23px var(--font); }
.bd-top .heading { all: unset; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
.bd-top .sub { color: var(--dim); font-size: 13.5px; }
.bd-top .grow { flex: 1; }
.pathf { display: flex; gap: 6px; }
.pathf .cat, .bd-top .capsule { font-size: 13px; }
.bd-cols { flex: 1; min-height: 0; display: grid; gap: 10px; overflow-x: auto; padding-bottom: 18px; }
.bd-band { border-radius: 16px; padding: 10px 12px; background: color-mix(in srgb, var(--accent) 16%, color-mix(in srgb, var(--ink) 6%, transparent));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.bd-band:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.bd-band b { font: 650 14px var(--font); }
.bd-band .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.bd-band { flex-wrap: nowrap; min-width: 0; overflow: hidden; }
.bd-band .arc { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; font-size: 12px; color: var(--dim); flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, #000 85%, transparent); }
.bd-band b, .bd-band .k, .bd-band .ptag { white-space: nowrap; flex: none; }
.bd-band .arc span { background: var(--wash); border-radius: 999px; padding: 2px 8px; color: var(--ink); }
.bd-col { display: flex; flex-direction: column; min-height: 0; border-radius: 18px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
.bd-col h2 { margin: 0; padding: 12px 12px 0; font: 650 14px var(--font); display: flex; justify-content: space-between; }
.bd-col h2 span { color: var(--dim); font-weight: 500; }
.bd-col p { margin: 2px 12px 8px; color: var(--dim); font-size: 12px; min-height: 30px; }
.bd-col .tiles { overflow: auto; padding: 0 8px 10px; display: grid; gap: 8px; align-content: start; }
.tile { all: unset; cursor: pointer; display: block; border-radius: 13px; padding: 7px; background: color-mix(in srgb, var(--gl-ground) 88%, transparent); box-shadow: 0 1px 0 var(--hair); }
.tile:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tile .th { height: 74px; border-radius: 8px; overflow: hidden; background: var(--wash); margin-bottom: 7px; }
.tile .th img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
.tile .n { font: 600 13px/1.25 var(--font); }
.tile .m { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: var(--dim); }
.ptag { font: 650 10.5px var(--font); letter-spacing: .02em; border-radius: 5px; padding: 1px 6px; }
.ptag.happy { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.ptag.variation { background: var(--wash-2); color: var(--dim); }
.ptag.edge { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.ptag.none { background: transparent; box-shadow: inset 0 0 0 1px var(--hair); color: var(--dim); }
/* the same journey in the sidebar, compact */
.jgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 4px; }
.jt { all: unset; cursor: pointer; position: relative; border-radius: 10px; padding: 7px 18px 8px 9px; font-size: 12.5px; line-height: 1.22; background: var(--wash); min-height: 34px; }
.jt.sel { background: var(--wash-2); box-shadow: inset 0 0 0 1.5px var(--ink); }
.jt .dot { position: absolute; right: 7px; top: 9px; width: 7px; height: 7px; border-radius: 50%; }
.dot.happy { background: var(--ok); } .dot.variation { background: var(--faint); } .dot.edge { background: var(--warn); } .dot.none { box-shadow: inset 0 0 0 1px var(--dim); }
.jt .br { display: block; color: var(--fault); font-size: 11px; margin-top: 3px; }
.rail .pathf { padding: 2px 14px 8px; flex-wrap: wrap; }
.rail .pathf .cat { padding: 5px 10px; font-size: 12.5px; }
.backboard { all: unset; cursor: pointer; font-size: 13px; color: var(--dim); padding: 2px 20px 6px; display: block; }
/* a decision or a note beside the step: two panels over the map, the step stays the context */
#side { position: absolute; z-index: 6; top: 14px; bottom: 14px; right: 14px; width: 410px; display: flex; flex-direction: column; border-radius: var(--r-lg); overflow: hidden; }
#side[hidden] { display: none; }
#side .sheet-body { flex: 1; overflow: auto; }
.base.beside .detail { position: absolute; z-index: 5; top: 0; bottom: 0; right: 424px; width: 400px; }
.base.beside .detail.frost::before { display: none; }
.base.beside .detail { background: color-mix(in srgb, var(--deep) 92%, #000); }
#side .sheet { width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; display: flex; flex-direction: column; }
#side .nav h3 { white-space: normal; line-height: 1.25; }
.side-step { display: flex; gap: 8px; align-items: center; padding: 6px 18px 12px; font-size: 13px; color: var(--dim); }
.side-step button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 999px; background: var(--wash); color: var(--ink); }
.side-step button[disabled] { opacity: .35; cursor: default; }
/* the strip of icons and the list panel beside it */
.strip { position: absolute; z-index: 6; left: 0; top: 0; bottom: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 16px 0 14px; background: color-mix(in srgb, var(--gl-ground) 72%, transparent); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
  box-shadow: inset -.5px 0 0 var(--hair); color: var(--ink); }
.strip .grow { flex: 1; }
.si { all: unset; cursor: pointer; position: relative; width: 52px; padding: 7px 0 6px; border-radius: 12px; display: grid; justify-items: center; gap: 3px; font: 500 10.5px var(--font); color: var(--dim); }
.si .icon { width: 20px; height: 20px; color: var(--ink); }
.si.on { background: var(--wash-2); color: var(--ink); font-weight: 600; }
.si:hover:not(.on) { background: var(--wash); }
.si .badge { position: absolute; top: 2px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; font: 650 10px/16px var(--font); font-style: normal; text-align: center; background: var(--wash-2); color: var(--ink); }
.si .badge.hot { background: var(--accent); color: #fff; }
.avatar.sm { width: 30px; height: 30px; font-size: 13px; }
.base { left: 64px; grid-template-columns: 284px 1fr 400px; }
#board { left: 64px !important; }
.app.panel-over #base { visibility: hidden; }
.app.panel-over #base .rail { visibility: visible; }
.app.panel-over #board { left: 348px !important; }
.side-seg { margin: 2px 14px 8px; }
.side-seg button { font-size: 12.5px; height: 28px; white-space: nowrap; padding: 0 6px; }
.bd-top .side-seg { margin: 0; width: 330px; }
.rail-section .cnt { float: right; font-weight: 500; color: var(--faint); }
.jt-edge { display: block; font-size: 10.5px; color: var(--warn); margin-top: 3px; }
.jt .br { display: block; font-size: 11px; margin-top: 3px; }
/* map: words only where you look */
.edge.far { opacity: .45; }
/* step card: provenance folded */
.tc-details { margin: 0 20px 6px; font-size: 13px; color: var(--dim); }
.tc-details summary { cursor: pointer; list-style: none; padding: 4px 0; }
.tc-details summary::before { content: '›'; display: inline-block; margin-right: 6px; transition: transform 160ms; }
.tc-details[open] summary::before { transform: rotate(90deg); }
.tc-details .tc-meta { padding: 4px 0 6px; }
.crop { position: relative; }
.crop-clients { position: absolute; right: 10px; top: 10px; z-index: 3; pointer-events: auto; display: flex; padding: 2px; gap: 2px; border-radius: 999px; background: color-mix(in srgb, var(--gl-ground) 82%, transparent); }
.crop-clients button { all: unset; pointer-events: auto; cursor: pointer; font: 600 11.5px var(--font); padding: 3px 10px; border-radius: 999px; color: var(--dim); }
.crop-clients button.on { background: var(--gl-open-fill, rgba(127,127,127,.18)); color: var(--ink); }
.crop-clients button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.crop-chip { position: absolute; left: 10px; bottom: 10px; font: 600 11.5px var(--font); padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--gl-ground) 82%, transparent); color: var(--dim); }
/* board: content on the tint, not cards in panes */
.bd-col { background: transparent !important; }
.bd-col h2 { position: sticky; top: 0; }
.tile { background: color-mix(in srgb, var(--ink) 8%, transparent) !important; box-shadow: none !important; padding: 10px !important; border-radius: 14px !important; }
.tile.happy { box-shadow: inset 3px 0 0 var(--ok) !important; }
.tile .th { height: 70px; }
.tile .m { font-size: 12px; }
.bd-cols { gap: 8px !important; }
/* light mode: the page itself turns light ("dark tiles on blue" was the one gap). The product's colours stay as a
   pale wash under a white scrim; ink goes dark; the one action is the product's deep colour. */
.app[data-gl-appearance="light"] {
  --gl-ground: color-mix(in srgb, var(--deep) 7%, #f3f5f8);
  --ground-scrim: color-mix(in srgb, #f3f5f8 78%, transparent);
  --gl-accent: var(--deep);
  --gl-on-accent: #fff;
  --gl-ok: #248a3d; --gl-warn: #b25000; --gl-fault: #d70015;   /* saltglass's status family is tuned for dark */
}
html[data-theme="light"], html[data-theme="light"] body { background: #f3f5f8; }
.app[data-gl-appearance="light"] .tile { background: color-mix(in srgb, #fff 72%, transparent) !important; box-shadow: 0 .5px 0 var(--hair), 0 1px 3px rgb(7 12 19 / .06) !important; }
.app[data-gl-appearance="light"] .tile.happy { box-shadow: inset 3px 0 0 var(--ok), 0 1px 3px rgb(7 12 19 / .06) !important; }
.app[data-gl-appearance="light"] .tile:hover { box-shadow: inset 0 0 0 1.5px var(--ink) !important; }
.app[data-gl-appearance="light"] .base.beside .detail { background: color-mix(in srgb, var(--deep) 6%, #fff); }
/* the iPad, landscape by default: 1194 or 1180 wide in landscape. The columns
   narrow, the map's capsules keep their icons, and nothing hides behind the floating card. Touch has no hover and no
   keyboard hints; a double tap never zooms. */
@media (max-width: 1320px) {
  .base { grid-template-columns: 248px minmax(0, 1fr) 356px; }
  .app.panel-over #board { left: 312px !important; }
  .floatbar { min-width: 0; }
  .floatbar .capsule .lbl { display: none; }
  .floatbar .capsule { padding: 0 13px; }
  .bd-col { min-width: 0; }
  .side-seg button { font-size: 12px; padding: 0 4px; }
}
.si .badge { right: -1px; top: 0; }
@media (max-width: 1000px) {                      /* portrait: the map keeps the most room */
  .base { grid-template-columns: 210px minmax(0, 1fr) 320px; }
  .app.panel-over #board { left: 274px !important; }
}
/* a decision's answers, side by side in the middle */
.dm-stage.examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-content: start; padding: 4px 22px 18px; overflow: auto; }
.excard { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 16px; background: var(--wash); box-shadow: inset 0 0 0 1px var(--hair); }
.excard[aria-disabled="true"] { cursor: default; }
.excard.on { box-shadow: inset 0 0 0 2px var(--gl-accent); background: var(--wash-2); }
.excard .expic { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 10px; display: block; min-height: 120px; }
.excard .sketch.expic { padding: 8px; box-sizing: border-box; aspect-ratio: 4 / 3; }
.exlabel { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); }
/* in decision mode the decision panel (424px with its gap) is wider than the card column it sits over; the middle
   stops where the panel starts */
.app:not(.phone) .base.deciding #mid { margin-right: 24px; }
@media (max-width: 1320px) { .app:not(.phone) .base.deciding #mid { margin-right: 68px; } }
@media (max-width: 1000px) { .app:not(.phone) .base.deciding #mid { margin-right: 104px; } }
.oex { display: none; }

<script>
// A snapshot (saltflow publish) carries its data here; the live page fetches it from the local server.
const INLINE = __INLINE__

const BEHIND_WORDS = { none: 'nothing behind', recede: 'home recedes', tile: 'home as a tile' }

const jobName = ref => (bundle && bundle.jobs[ref]) || (today && today.jobs[ref.split('#').pop()]) || ref.split('#').pop()

// ── state ──

async function api(path, body) {
  if (INLINE) {
    if (path === '/api/product') return INLINE.product
    if (path === '/api/today') return INLINE.today
    if (path.startsWith('/api/flow/')) return INLINE.flows[path.slice(10)]
    throw new Error('This is a snapshot: it cannot write. Open the page from the local server to leave a note.')
  }
  if (productName && !path.startsWith('/api/products')) path += (path.includes('?') ? '&' : '?') + 'product=' + encodeURIComponent(productName)

  if (!r.ok) throw new Error(j.error || r.statusText)

}
async function load(keepSel) {
  if (!INLINE) {
    products = await api('/api/products')
    const [hp, hf, hs] = hashParts()
    if (!productName) { productName = products.some(p => p.name === hp) ? hp : (products.find(p => p.default) || products[0] || {}).name; if (hp === productName) { if (hf === 'decide') { view = 'decide'; decId = hs || null } else { flowId = flowId || hf || null; sel = sel || hs || null } } }
  }

  if (view === 'decide') { bundle = null; order = []; return showDecision() }
  view = flowId ? 'flow' : 'board'
  bundle = flowId ? await api('/api/flow/' + flowId) : null
  order = bundle ? layout(bundle.flow).order : []
  if (!bundle || !bundle.flow.steps[sel]) sel = bundle ? firstInteresting() : null   // a step from the address bar or the last draw stays
  drawAll()
}
async function switchProduct(name) { productName = name; flowId = null; sel = null; seen = null; closeLayer(); closeSide(); await load() }
function toBoard() { leaveDecide(); view = 'board'; flowId = null; bundle = null; sel = null; closeSide(); toggleFeed(false); drawAll() }
function firstInteresting() {
  const bad = bundle.runs.find(r => 'expect' in r && r.verdict !== 'ok')

}

  document.getElementById('app')?.setAttribute('data-gl-appearance', scheme)

}

// ── the journey: stages in order, flows tagged happy, variation or edge by the product's session ──
const AREA_WORDS = { all: 'Every line' }
const areaName = a => a ? (AREA_WORDS[a] || a[0].toUpperCase() + a.slice(1)) : 'Other'

document.addEventListener('keydown', e => {
  // decision mode: ↑↓ or j/k move through the list, 1–9 pick an option, Enter decides, / goes to your words
  if (view === 'decide' && !layer && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
    const L = decList(), at = L.findIndex(d => d.id === decId)
    if (['ArrowDown', 'j'].includes(e.key) && at < L.length - 1) { e.preventDefault(); decId = L[at + 1].id; return showDecision() }
    if (['ArrowUp', 'k'].includes(e.key) && at > 0) { e.preventDefault(); decId = L[at - 1].id; return showDecision() }
    if (/^[1-9]$/.test(e.key) && decideKeys) { decideKeys.pick(+e.key - 1); return }
    if (e.key === 'Enter' && decideKeys && decideKeys.decide) { e.preventDefault(); return decideKeys.decide() }
    if (e.key === '/' && decideKeys) { e.preventDefault(); decideKeys.words.focus(); return }
  }
  if (e.key === 'Escape') { if (layer) return closeLayer(); if (side) return closeSide(); if (feedOpen) return toggleFeed(false); return }
  if (layer || !bundle || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return
  const i = order.indexOf(sel)
  if (e.key === 'ArrowRight') { sel = order[(i + 1) % order.length]; drawAll() }
  if (e.key === 'ArrowLeft') { sel = order[(i - 1 + order.length) % order.length]; drawAll() }
})
// saltFlow's own stage: ?stage=<surface>&state=<fixture> opens one component on the fixture the server inlined
const STAGE = new URLSearchParams(location.search).get('stage')
async function stageTo() {
  const go = INLINE.go || {}
  if (STAGE === 'board.journey') return toBoard()
  if (STAGE === 'sheet.decision') return enterDecide(go.decision)
  await openFlow(go.flow, go.step)
  if (STAGE === 'feed.today') { feedFilter = go.feed || 'broke'; toggleFeed(true) }
  if (STAGE === 'sheet.why') openWhy((bundle.flow.steps[sel].patterns || [])[0], [])
  if (STAGE === 'sheet.note') openNote()
}
load().then(() => STAGE && INLINE ? stageTo() : null).catch(e => { document.getElementById('mid').replaceChildren(h('div', { class: 'map' }, h('div', { class: 'empty' }, h('b', {}, 'The page could not load'), h('code', {}, e.message)))) })
</script>
