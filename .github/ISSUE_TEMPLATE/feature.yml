name: Idea or feature request
description: Something saltFlow could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you have in mind, in plain words. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A sketch or a screenshot is welcome.
  - type: textarea
    id: else
    attributes:
      label: What you tried instead
